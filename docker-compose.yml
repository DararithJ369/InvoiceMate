services:
  invoicemate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicemate_app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_DIR=/app/storage/invoices
      - DATABASE_URL=sqlite:////app/data/invoicemate.db
    volumes:
      - invoicemate_data:/app/data
      - invoicemate_storage:/app/storage/invoices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  invoicemate_data:
  invoicemate_storage:
